name: release-images
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  images:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: community
            file: Dockerfile
            arg: SERVICE=community
          - service: review
            file: Dockerfile
            arg: SERVICE=review
          - service: worker
            file: Dockerfile
            arg: SERVICE=worker
          - service: alertbridge
            file: Dockerfile
            arg: SERVICE=alertbridge
          - service: community-web
            file: deploy/Dockerfile.web
            arg: APP=community
          - service: review-web
            file: deploy/Dockerfile.web
            arg: APP=review
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.arg }}
          push: true
          tags: ${{ steps.names.outputs.prefix }}/${{ matrix.service }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
