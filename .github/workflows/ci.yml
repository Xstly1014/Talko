name: community-ci
on:
  push:
  pull_request:
  workflow_call:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: talko_test
          MYSQL_ROOT_PASSWORD: ci_root
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pci_root" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_MYSQL_DSN: root:ci_root@tcp(127.0.0.1:3306)/talko_test?parseTime=true&multiStatements=true&charset=utf8mb4&loc=UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -p=1 -count=1 -v ./...
      - run: go vet ./...
  frontend:
    strategy:
      matrix:
        app: [community, review]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: web/${{ matrix.app }}
      - run: npm run build
        working-directory: web/${{ matrix.app }}

  infrastructure:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      MYSQL_PASSWORD: ci_application_only
      MYSQL_ROOT_PASSWORD: ci_root_only
      GRAFANA_PASSWORD: ci_grafana_only
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: for script in deploy/bin/*.sh scripts/check-runtime.sh; do bash -n "$script"; done
      - name: Containers, scrape recovery and restore rehearsal
        run: bash deploy/bin/acceptance.sh
        timeout-minutes: 20
      - name: Stack diagnostics
        if: always()
        run: docker compose -f deploy/compose.yaml logs --no-color --tail 150
      - name: Remove isolated CI stack
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
