{
  "global": {
    "scrape_interval": "15s",
    "evaluation_interval": "15s"
  },
  "rule_files": [
    "/etc/prometheus/alerts.yaml"
  ],
  "scrape_configs": [
    {
      "job_name": "community",
      "static_configs": [
        {
          "targets": [
            "community:8080"
          ]
        }
      ]
    },
    {
      "job_name": "review",
      "static_configs": [
        {
          "targets": [
            "review:8081"
          ]
        }
      ]
    },
    {
      "job_name": "worker",
      "static_configs": [
        {
          "targets": [
            "worker:8085"
          ]
        }
      ]
    }
  ],
  "alerting": {
    "alertmanagers": [
      {
        "static_configs": [
          {
            "targets": [
              "alertmanager:9093"
            ]
          }
        ]
      }
    ]
  }
}
