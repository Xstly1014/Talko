server { listen 80; server_tokens off; client_max_body_size 6m;
 location = /healthz { return 200 'ready'; }
 location /review-api/ { proxy_pass http://review:8081; proxy_set_header Host $host; proxy_connect_timeout 3s; proxy_read_timeout 25s; }
 location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
