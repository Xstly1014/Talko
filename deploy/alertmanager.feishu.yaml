{
  "route": {
    "receiver": "feishu",
    "group_by": [
      "alertname",
      "job"
    ],
    "group_wait": "30s",
    "group_interval": "5m",
    "repeat_interval": "4h"
  },
  "receivers": [
    {
      "name": "feishu",
      "webhook_configs": [
        {
          "url": "http://alertbridge:8082/alerts",
          "send_resolved": true,
          "max_alerts": 20,
          "http_config": {
            "authorization": {
              "type": "Bearer",
              "credentials_file": "/run/secrets/alert_token"
            }
          }
        }
      ]
    }
  ]
}
